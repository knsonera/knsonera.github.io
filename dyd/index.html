  <!-- The link Don't You Dare puts in every share: sends phones straight to their store, shows both badges elsewhere. -->
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (/Android/i.test(ua)) location.replace("https://play.google.com/store/apps/details?id=com.mindgameslab.dyd");
