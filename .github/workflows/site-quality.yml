name: Site Quality

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  html-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate HTML
        run: |
          npm install -g htmlhint
          htmlhint index.html apps/*.html privacy.html terms.html 404.html

      # Current lychee: mail links are skipped by default (the old --exclude-mail flag is gone and made
      # the step exit 2), and root-relative links like /privacy.html need --root-dir to resolve.
      - name: Check Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --root-dir "${{ github.workspace }}" --max-retries 2 --retry-wait-time 2 --accept 200,206,301,302,307,308,403,429 --exclude "^https://fonts\.(googleapis|gstatic)\.com/?$" --exclude "https://apps.apple.com/.*" --exclude "https://play.google.com/.*" index.html apps/*.html privacy.html terms.html 404.html

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install LHCI
        run: npm install -g @lhci/cli@0.14.x

      # Lighthouse is advisory: the "recommended" preset flags image sizing, lazy-loaded LCP images,
      # unused JS etc. on every page. Findings show up as warnings on the run; they never fail it.
      - name: Run Lighthouse CI
        run: |
          lhci collect --config=lighthouserc.json
          lhci assert --config=lighthouserc.json || echo "::warning title=Lighthouse::Lighthouse found advisory issues - see the assert output above and the report links below"
          lhci upload --config=lighthouserc.json || true
